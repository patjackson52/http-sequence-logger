name: NetworkLogTransferDemo
options:
  bundleIdPrefix: com.example.networklog
  deploymentTarget:
    iOS: '15.0'
packages:
  NetworkLogTransfer:
    path: .
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  NetworkLogProductionApp:
    type: application
    platform: iOS
    sources: [Production]
    info:
      path: .local/ProductionInfo.plist
      properties:
        CFBundleDisplayName: Sample application
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.networklog.production
  NetworkLogTransferDemo:
    type: application
    platform: iOS
    sources: [Demo]
    dependencies:
      - package: NetworkLogTransfer
    info:
      path: .local/DemoInfo.plist
      properties:
        CFBundleDisplayName: Network Log Demo
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Discover and transfer development captures to a paired local collector.
        NSBonjourServices: ["_nlog._tcp"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.networklog.demo
  NetworkLogTransferTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/NetworkLogTransferTests
        excludes: [Fixtures]
      - path: IntegrationTests
      - path: Tests/NetworkLogTransferTests/Fixtures
        buildPhase: resources
      - path: .local/IntegrationConfig.json
        optional: true
        buildPhase: resources
    dependencies:
      - target: NetworkLogTransferDemo
      - package: NetworkLogTransfer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.networklog.tests
schemes:
  NetworkLogProductionApp:
    build:
      targets:
        NetworkLogProductionApp: all
    run:
      config: Release
    profile:
      config: Release
    archive:
      config: Release
  NetworkLogTransferDemo:
    build:
      targets:
        NetworkLogTransferDemo: [run, test, analyze]
    run:
      config: Debug
    test:
      config: Debug
      targets: [NetworkLogTransferTests]
      gatherCoverageData: false
